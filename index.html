<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инь Янь — Учёт сотрудников</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    select, button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 17px;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
    }

    .logout {
      background: #ddd;
      color: #111;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f0f0f0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Инь Янь</h1>
  <p>Учёт рабочего времени</p>

  <select id="employee">
    <option value="">Выберите сотрудника</option>
  </select>

  <button onclick="checkIn()">
    🟢 Я пришёл
  </button>

  <button onclick="checkOut()">
    🔴 Я ухожу
  </button>

  <div id="status">
    Готово к отметке
  </div>

</div>

<script>

const SUPABASE_URL =
"https://klkmdcxgewlcdshdkmtd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rNiYYh6VnK6jLPOEi-DN3A_E7-vIg96";


async function loadEmployees() {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/employees?select=id,full_name&is_active=eq.true",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const employees = await response.json();

  const select = document.getElementById("employee");

  employees.forEach(employee => {

    const option = document.createElement("option");

    option.value = employee.id;
    option.textContent = employee.full_name;

    select.appendChild(option);

  });

}


function getLocation() {

  return new Promise((resolve, reject) => {

    navigator.geolocation.getCurrentPosition(

      position => {

        resolve({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        });

      },

      () => {
        reject("Разрешите доступ к геолокации");
      }

    );

  });

}


async function markAttendance(action) {

  const employee =
    document.getElementById("employee").value;

  if (!employee) {

    document.getElementById("status").innerText =
      "Сначала выберите сотрудника";

    return;

  }

  document.getElementById("status").innerText =
    "Получаем геолокацию...";


  try {

    const location = await getLocation();


    const response = await fetch(

      SUPABASE_URL + "/rest/v1/attendance",

      {

        method: "POST",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          employee_id: employee,

          action: action,

          latitude:
            location.latitude,

          longitude:
            location.longitude

        })

      }

    );


    if (!response.ok) {

      throw new Error(
        "Ошибка записи в базу"
      );

    }


    document.getElementById("status").innerText =

      action === "check_in"

      ? "✅ Приход записан"

      : "✅ Уход записан";


  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error;

  }

}


function checkIn() {

  markAttendance("check_in");

}


function checkOut() {

  markAttendance("check_out");

}


loadEmployees();

</script>

</body>
</html>
