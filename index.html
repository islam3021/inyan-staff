<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Инь Янь — Учёт рабочего времени</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    input,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 17px;
      box-sizing: border-box;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
    }

    button.green {
      background: #16803c;
    }

    button.red {
      background: #c62828;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f0f0f0;
    }

    .hidden {
      display: none;
    }

    .employee-name {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Инь Янь</h1>

  <p>Учёт рабочего времени</p>

  <div id="login">

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Введите PIN"
    >

    <button onclick="login()">
      Войти
    </button>

  </div>


  <div id="employeePanel" class="hidden">

    <div class="employee-name" id="employeeName"></div>

    <button class="green" onclick="markAttendance('check_in')">
      🟢 Я пришёл
    </button>

    <button class="red" onclick="markAttendance('check_out')">
      🔴 Я ухожу
    </button>

  </div>


  <div id="status">
    Введите PIN
  </div>

</div>


<script>

const SUPABASE_URL =
"https://klkmdcxgewlcdshdkmtd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rNiYYh6VnK6jLPOEi-DN3A_E7-vIg96";


/*
  КООРДИНАТЫ КАФЕ «ИНЬ ЯНЬ»
*/

const CAFE_LAT = 53.019156;
const CAFE_LON = 51.162579;


/*
  РАДИУС РАБОЧЕЙ ЗОНЫ

  100 метров
*/

const ALLOWED_RADIUS = 100;


let currentEmployee = null;


/*
  Расстояние между двумя GPS координатами
*/

function distanceInMeters(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/*
  Вход по PIN
*/

async function login() {

  const pin =
    document.getElementById("pin").value.trim();

  if (!pin) {

    showStatus(
      "Введите PIN",
      true
    );

    return;
  }


  showStatus(
    "Проверяем PIN..."
  );


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/employees" +
      "?select=id,full_name,pin" +
      "&is_active=eq.true" +
      "&pin=eq." +
      encodeURIComponent(pin),

      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY

        }

      }

    );


    if (!response.ok) {

      throw new Error(
        "Ошибка соединения с базой"
      );

    }


    const employees =
      await response.json();


    if (
      !employees ||
      employees.length === 0
    ) {

      showStatus(
        "❌ Неверный PIN",
        true
      );

      return;
    }


    currentEmployee =
      employees[0];


    document.getElementById(
      "employeeName"
    ).innerText =
      currentEmployee.full_name;


    document.getElementById(
      "login"
    ).classList.add("hidden");


    document.getElementById(
      "employeePanel"
    ).classList.remove("hidden");


    showStatus(
      "Вы вошли в систему ✅"
    );

  }

  catch(error) {

    showStatus(
      error.message,
      true
    );

  }

}


/*
  Получение геолокации
*/

function getLocation() {

  return new Promise(

    (resolve, reject) => {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            "Ваш телефон не поддерживает геолокацию"
          )
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy

          });

        },

        error => {

          reject(
            new Error(
              "Разрешите доступ к геолокации"
            )
          );

        },

        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }

  );

}


/*
  Приход / уход
*/

async function markAttendance(action) {

  if (!currentEmployee) {

    showStatus(
      "Сначала войдите по PIN",
      true
    );

    return;
  }


  showStatus(
    "📍 Определяем ваше местоположение..."
  );


  try {

    const location =
      await getLocation();


    /*
      Считаем расстояние до кафе
    */

    const distance =
      distanceInMeters(

        location.latitude,

        location.longitude,

        CAFE_LAT,

        CAFE_LON

      );


    /*
      Проверяем рабочую зону
    */

    if (
      distance > ALLOWED_RADIUS
    ) {

      showStatus(

        "❌ Вы находитесь вне рабочей зоны. " +
        "Расстояние до кафе: " +
        Math.round(distance) +
        " м",

        true

      );

      return;
    }


    showStatus(
      "📍 Вы в рабочей зоне. Записываем..."
    );


    /*
      Отправляем отметку в Supabase
    */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/attendance",

        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            employee_id:
              currentEmployee.id,

            action:
              action,

            latitude:
              location.latitude,

            longitude:
              location.longitude

          })

        }

      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Ошибка записи"
      );

    }


    if (
      action === "check_in"
    ) {

      showStatus(
        "🟢 Приход записан ✅"
      );

    } else {

      showStatus(
        "🔴 Уход записан ✅"
      );

    }

  }

  catch(error) {

    showStatus(
      "❌ " +
      error.message,
      true
    );

  }

}


/*
  Сообщения пользователю
*/

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );

  status.innerText =
    message;

  status.style.background =
    error
      ? "#ffdddd"
      : "#f0f0f0";

}


/*
  Запрет стандартного поведения формы
*/

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        login();

      }

    }
  );

</script>

</body>
</html>
